<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163c45"><title>補助金ウォッチ</title><style>
:root{font-family:system-ui,-apple-system,'Yu Gothic',sans-serif;color:#172c32;background:#f3f6f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:20px}header{background:#163c45;color:white;padding:25px 20px}header .wrap{padding:0}h1{margin:0 0 8px;font-size:1.65rem}header p{margin:0;color:#d8e9e8}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select,button{font:inherit;padding:11px;border:1px solid #c9d4d2;border-radius:9px;background:white}input{flex:1;min-width:180px}button{cursor:pointer}.card{background:white;border:1px solid #dce5e3;border-radius:13px;padding:18px;margin:12px 0;box-shadow:0 1px 3px #00000008}.title{font-size:1.12rem;font-weight:700;margin:0 0 8px}.tag{display:inline-block;padding:4px 9px;background:#e6f3ed;border-radius:100px;color:#17543b;font-size:.8rem}.warn{background:#fff1d6;color:#755017}.muted{color:#586a6c;font-size:.88rem}a{color:#12667a;overflow-wrap:anywhere}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.empty{padding:30px;text-align:center}.small{font-size:.78rem}footer{margin:25px 0;color:#667}.counts{font-weight:700;margin-top:16px}
</style></head><body><header><div class="wrap"><h1>補助金ウォッチ</h1><p>長野県伊那市・食品製造業・従業員0人向け候補一覧</p></div></header><main class="wrap"><div id="updated" class="muted">データを読み込み中…</div><div class="toolbar"><input id="search" placeholder="補助金名・キーワードで検索" aria-label="キーワード検索"><select id="filter" aria-label="判定の絞り込み"><option value="recommended">おすすめ・要確認</option><option value="">すべて</option><option>関連候補</option><option>要確認</option><option>条件に注意</option><option>対象外候補</option></select><button id="reload">再読込</button></div><p class="muted">「関連候補」はタイトルに基づく推定で、申請資格の確定ではありません。従業員0人・賃上げ・過去採択歴・インボイスの要件は公募要領で必ず確認してください。</p><div id="counts" class="counts"></div><div id="items" aria-live="polite"></div><footer>出典：Jグランツ（デジタル庁）公開API。タイトル等の一覧項目に基づく推定であり、公式の公募要領の要約ではありません。<br>2022年：小規模事業者持続化補助金（商工会）採択済み。再申請可否は別途確認が必要です。</footer></main><script>
let data=[];const $=id=>document.getElementById(id);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function date(s){return s?escapeHTML(s.slice(0,10)):'未掲載'}function money(n){return typeof n==='number'?n.toLocaleString('ja-JP')+'円':'未掲載'}function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;let arr=data.filter(x=>(f==='recommended'?x.status!=='対象外候補':!f||x.status===f)&&(!q||(x.title+' '+x.institution+' '+x.area).toLowerCase().includes(q)));$('counts').textContent=`表示 ${arr.length}件 / 取得 ${data.length}件`;$('items').innerHTML=arr.length?arr.map(x=>`<article class="card"><div class="title">${escapeHTML(x.title)}</div><span class="tag ${x.status.includes('注意')||x.status==='要確認'?'warn':''}">${escapeHTML(x.status)}</span><p class="muted"><strong>用途の目安：</strong>${escapeHTML(x.description||"用途は未確認です")}</p><p class="muted">${escapeHTML(x.institution)}</p><div class="meta"><div><div class="muted small">補助上限</div>${money(x.maximum)}</div><div><div class="muted small">募集終了</div>${date(x.end)}</div><div><div class="muted small">対象地域</div>${escapeHTML(x.area||'未掲載')}</div><div><div class="muted small">従業員数</div>${escapeHTML(x.employees||'未掲載')}</div></div><p class="muted">${(x.reasons||[]).map(escapeHTML).join(' / ')}</p><a href="${escapeHTML(x.url)}" target="_blank" rel="noopener noreferrer">Jグランツで公式情報を確認</a></article>`).join(''):'<div class="card empty">条件に一致するデータはありません。</div>'}async function load(){try{let r=await fetch('./data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();data=d.items||[];$('updated').textContent='データ更新: '+(d.updated_at||'不明')+(d.partial?'（一部の検索で取得失敗）':'');render()}catch(e){$('updated').textContent='取得データを読み込めません。初回収集が未実行、または通信エラーです。';$('items').innerHTML='<div class="card">Windowsで collector.py を実行するか、GitHub Actionsの実行結果をご確認ください。</div>'}}$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('reload').addEventListener('click',load);load();
</script></body></html>
